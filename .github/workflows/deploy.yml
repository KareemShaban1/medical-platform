name: Deploy to Contabo Server

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'DEPLOYSCRIPT'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo '📥 Pulling latest changes...'
            git fetch origin
            git reset --hard origin/master || git reset --hard origin/main
            echo '📦 Installing Composer dependencies...'
            composer install --no-dev --optimize-autoloader --no-interaction
            echo '📦 Installing NPM dependencies...'
            npm ci --production
            echo '🔨 Building assets...'
            npm run build
            echo '🗄️ Running database migrations...'
            php artisan migrate --force
            echo '⚡ Optimizing application...'
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache
            echo '🧹 Clearing application cache...'
            php artisan cache:clear
            echo '🔐 Setting permissions...'
            chmod -R 755 storage bootstrap/cache
            chown -R www-data:www-data storage bootstrap/cache || true
            echo '🔄 Restarting queue workers...'
            php artisan queue:restart || true
            echo '🔄 Reloading PHP-FPM...'
            sudo systemctl reload php8.2-fpm || sudo systemctl reload php-fpm || true
            echo '✅ Deployment completed successfully!'
          DEPLOYSCRIPT

      - name: Deployment notification
        if: success()
        run: |
          echo "✅ Deployment to Contabo server completed successfully!"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo "❌ Deployment failed. Please check the logs above."

